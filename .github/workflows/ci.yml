name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Testes
    runs-on: windows-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar dependências
        run: dotnet restore Assetly.slnx

      - name: Compilar
        run: dotnet build Assetly.slnx --no-restore --configuration Release

      - name: Rodar testes
        run: dotnet test Assetly.slnx --no-build --configuration Release
