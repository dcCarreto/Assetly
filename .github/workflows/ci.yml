name: CI

on:
  push:
    branches:
      - main
      - desenvolvimento
  pull_request:
    branches:
      - main
      - desenvolvimento

jobs:
  test:
    name: Testes e autoteste
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar dependências
        run: dotnet restore Assetly.slnx

      - name: Compilar
        run: dotnet build Assetly.slnx --no-restore --configuration Release

      - name: Rodar testes (com cobertura)
        run: dotnet test Assetly.slnx --no-build --configuration Release --collect:"XPlat Code Coverage" --results-directory cobertura

      # Tabela de cobertura por camada no resumo da execução; falha se Domínio, Aplicação ou Infraestrutura
      # caírem abaixo do mínimo (ver .github/cobertura.ps1).
      - name: Cobertura dos testes
        shell: pwsh
        run: ./.github/cobertura.ps1 -Pasta cobertura

      - name: Guardar o relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura
          path: cobertura/**/coverage.cobertura.xml
          if-no-files-found: ignore

      # Abre o programa de verdade (sem janela): banco novo, migrações, dados fictícios, todas as telas e
      # formulários, exportação, patrimônio e backup criptografado. Mesmo teste usado antes de cada release.
      - name: Autoteste do programa
        shell: pwsh
        run: |
          $exe = Get-Item src\Assetly.Apresentacao\bin\Release\net10.0-windows10.0.19041.0\Assetly.exe
          $relatorio = Join-Path $env:RUNNER_TEMP "autoteste.txt"
          $p = Start-Process $exe.FullName -ArgumentList "--autoteste", "--relatorio=$relatorio" -Wait -PassThru
          Get-Content $relatorio -Encoding UTF8
          if ($p.ExitCode -ne 0) { throw "O autoteste falhou (código $($p.ExitCode))." }

      # Banco grande (500 bens, 5 mil contas, 2 mil documentos com 256 MB de anexos): tempos do ciclo da tela, busca,
      # exportação, backup e arquivo da sincronização no resumo da execução. Falha se o ciclo da tela passar de 5 s.
      - name: Autoteste com volume
        shell: pwsh
        run: |
          $exe = Get-Item src\Assetly.Apresentacao\bin\Release\net10.0-windows10.0.19041.0\Assetly.exe
          $relatorio = Join-Path $env:RUNNER_TEMP "autoteste-volume.txt"
          $p = Start-Process $exe.FullName -ArgumentList "--autoteste", "--volume=256", "--relatorio=$relatorio" -Wait -PassThru
          $linhas = Get-Content $relatorio -Encoding UTF8
          $linhas
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding UTF8 -Value ("### Autoteste com volume`n`n" + (($linhas | Where-Object { $_ -match 'Volume|RESULTADO' } | ForEach-Object { "- $_" }) -join "`n"))
          if ($p.ExitCode -ne 0) { throw "O autoteste com volume falhou (código $($p.ExitCode))." }
